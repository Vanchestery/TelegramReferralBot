services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: referralbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: TelegramReferralBot/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_REFERRALBOT_DB: "Host=db;Port=5432;Database=referralbot;Username=postgres;Password=postgres"
      REF_BOT_KEY: ${REF_BOT_KEY}
      REF_BOT_WEBHOOK_URL: ${REF_BOT_WEBHOOK_URL}
      BOT_USERNAME: ${BOT_USERNAME}
      JOSEPH_TELEGRAM_ID: ${JOSEPH_TELEGRAM_ID}
      KEY_LENGTH: ${KEY_LENGTH:-8}
      PARTNERS_API_KEY: ${PARTNERS_API_KEY}
      STEPIK_CLIENT_ID: ${STEPIK_CLIENT_ID}
      STEPIK_CLIENT_SECRET: ${STEPIK_CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
