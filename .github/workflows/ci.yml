name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore TelegramReferralBot.sln

      - name: Build (Release)
        run: dotnet build TelegramReferralBot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TelegramReferralBot.sln --configuration Release --no-build --verbosity normal
